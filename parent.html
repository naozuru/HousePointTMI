<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Wali Murid - TMI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
    <!-- LOGIN PAGE -->
    <div class="login-container" id="loginPage">
        <div class="login-card">
            <div class="logo-area">
                <div class="logo-circle">
                    <iconify-icon icon="mdi:account-child" width="40"></iconify-icon>
                </div>
                <h1>Portal Wali Murid</h1>
                <p>Tunas Mekar Indonesia</p>
            </div>
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="nisInput" placeholder="Masukkan NIS Siswa" required inputmode="numeric" autocomplete="off">
                    <iconify-icon icon="mdi:card-account-details-outline" class="input-icon"></iconify-icon>
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <iconify-icon icon="mdi:eye-outline"></iconify-icon> Lihat Poin
                </button>
            </form>

            <div style="margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--gray-100);">
                <a href="index.html" style="color: var(--gray-500); font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 500;">
                    <iconify-icon icon="mdi:school"></iconify-icon>
                    Login sebagai Guru
                </a>
            </div>
        </div>
    </div>

    <!-- DASHBOARD PAGE -->
    <main class="dashboard-container hidden" id="parentDashboard">
        <div class="card">
            <button class="btn-back" onclick="logoutParent()">
                <iconify-icon icon="mdi:logout"></iconify-icon> Keluar
            </button>
            <div id="parentStudentHeader"></div>
        </div>

        <div class="card">
            <h3>
                <iconify-icon icon="mdi:history"></iconify-icon> Riwayat Poin
            </h3>
            <div class="list-container" id="parentHistoryList"></div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="config.js"></script>
    <script src="parent.js"></script>
</body>
</html>
