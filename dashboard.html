<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#004632">
    <title>Dashboard - Tunas Mekar Indonesia</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="config.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <div class="logo-circle small header-logo">
                <iconify-icon icon="mdi:sprout" width="22"></iconify-icon>
            </div>
            <div class="header-titles">
                <h2>Tunas Mekar Indonesia</h2>
                <small id="teacherName">Loading...</small>
            </div>
        </div>
        <div class="header-right">
            <button class="btn-nav" onclick="window.location.href='reports.html'" title="Reports">
                <iconify-icon icon="mdi:trophy-variant"></iconify-icon>
            </button>
            <button class="btn-nav" onclick="refreshDashboard()" title="Refresh">
                <iconify-icon icon="mdi:refresh"></iconify-icon>
            </button>
            <button class="btn-logout" onclick="window.TMI.logout()" title="Logout">
                <iconify-icon icon="mdi:logout"></iconify-icon>
            </button>
        </div>
    </header>

    <main class="dashboard-container">
        <!-- STAT CARDS -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="skeleton" style="height:80px;"></div></div>
            <div class="stat-card"><div class="skeleton" style="height:80px;"></div></div>
            <div class="stat-card"><div class="skeleton" style="height:80px;"></div></div>
            <div class="stat-card"><div class="skeleton" style="height:80px;"></div></div>
        </div>

        <!-- HOUSE POINTS -->
        <div class="house-points-banner" id="housePointsBanner">
            <div class="house-item house-JJT" id="houseCard-JJT">
                <div class="house-icon-row">
                    <iconify-icon icon="mdi:shield-star"></iconify-icon>
                    <span class="house-name">JJT</span>
                </div>
                <span class="house-score" id="houseJJT">0</span>
            </div>
            <div class="house-item house-Jensud" id="houseCard-Jensud">
                <div class="house-icon-row">
                    <iconify-icon icon="mdi:shield-star"></iconify-icon>
                    <span class="house-name">Jensud</span>
                </div>
                <span class="house-score" id="houseJensud">0</span>
            </div>
            <div class="house-item house-Munir" id="houseCard-Munir">
                <div class="house-icon-row">
                    <iconify-icon icon="mdi:shield-star"></iconify-icon>
                    <span class="house-name">Munir</span>
                </div>
                <span class="house-score" id="houseMunir">0</span>
            </div>
        </div>

        <!-- STUDENT SELECTION -->
        <div class="card" id="studentSelectionCard">
            <div class="card-header-row">
                <h3><iconify-icon icon="mdi:account-group-outline"></iconify-icon> Select Student</h3>
                <div class="chip-row" id="quickFilters">
                    <span class="chip" data-house="">All</span>
                    <span class="chip" data-house="JJT">JJT</span>
                    <span class="chip" data-house="Jensud">Jensud</span>
                    <span class="chip" data-house="Munir">Munir</span>
                </div>
            </div>

            <div class="nfc-tap-area" id="studentNfcArea">
                <iconify-icon icon="mdi:nfc-variant" width="32"></iconify-icon>
                <span>Tap a Student Card here</span>
                <small style="font-weight: 500; opacity: 0.7;">Or search manually below</small>
            </div>

            <div class="search-filter">
                <div class="input-icon-wrapper">
                    <input type="text" id="searchStudent" placeholder="Search by name or NIS...">
                    <iconify-icon icon="mdi:magnify" class="input-icon-left"></iconify-icon>
                </div>
                <select id="classFilter">
                    <option value="all">All Levels</option>
                    <option value="JHS">JHS (7-9)</option>
                    <option value="SHS">SHS (10-12)</option>
                    <option value="7">Grade 7</option>
                    <option value="8">Grade 8</option>
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                    <option value="11">Grade 11</option>
                    <option value="12">Grade 12</option>
                </select>
            </div>

            <div class="list-container" id="studentList">
                <div class="skeleton skeleton-list-item" style="height:60px;"></div>
                <div class="skeleton skeleton-list-item" style="height:60px;"></div>
                <div class="skeleton skeleton-list-item" style="height:60px;"></div>
                <div class="skeleton skeleton-list-item" style="height:60px;"></div>
            </div>
        </div>

        <!-- ACTION CARD -->
        <div class="card hidden" id="actionCard">
            <button class="btn-back" id="backBtn">
                <iconify-icon icon="mdi:arrow-left"></iconify-icon> Back
            </button>

            <div id="studentDetailHeader"></div>

            <div class="action-buttons">
                <button class="btn btn-plus" onclick="showViolations('plus')">
                    <iconify-icon icon="mdi:plus-thick"></iconify-icon> Add Points
                </button>
                <button class="btn btn-minus" onclick="showViolations('minus')">
                    <iconify-icon icon="mdi:minus-thick"></iconify-icon> Subtract Points
                </button>
            </div>

            <div class="hidden" id="violationsSection">
                <div class="input-icon-wrapper" style="margin-bottom: 14px;">
                    <input type="text" id="searchViolation" class="input-with-left-icon" placeholder="Search violation...">
                    <iconify-icon icon="mdi:magnify" class="input-icon-left"></iconify-icon>
                </div>
                <div class="chip-row" id="categoryChips"></div>
                <div class="violation-list list-container" id="violationList"></div>
            </div>

            <!-- Recent history preview -->
            <div id="studentHistoryPreview" class="mt-4 hidden">
                <h3 style="font-size:14px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;">
                    <iconify-icon icon="mdi:history"></iconify-icon> Recent History
                </h3>
                <div class="list-container" id="studentHistoryList"></div>
            </div>
        </div>
    </main>

    <script src="shared.js"></script>
    <script src="app.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
